[workspace]
resolver = "3"
members = ["core", "pki", "db", "api", "cli"]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
porchlight-core = { path = "core" }
porchlight-db = { path = "db" }
porchlight-pki = { path = "pki" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "signal", "time", "sync", "net", "io-util", "fs"] }
uuid = { version = "1.27", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# M2 (trust). TLS 1.3 only, ring provider everywhere (musl-static friendly; no aws-lc).
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service", "client-legacy"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
x509-parser = "0.18"
time = "0.3"
argon2 = { version = "0.6", features = ["zeroize"] }
sha2 = "0.11"
getrandom = { version = "0.4", features = ["std"] }
base64 = "0.23"
hex = "0.4"
aes-gcm = "0.11"
hmac = "0.13"
hkdf = "0.13"
url = "2"
ipnet = "2"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
zeroize = "1"
qrcode = { version = "0.14", default-features = false }
rpassword = "7"
tempfile = "3"
# M3–M8 (items, collaboration, calendar, ship). Added by the controller before the pass: sandboxed implementers
# have no network and may only use crates declared here.
rrule = "0.14"
chrono-tz = "0.10"
fractional_index = "2"
proptest = "1.11"
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid", "preserve_order"] }
icalendar = { version = "0.17", features = ["parser", "chrono-tz"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
infer = "0.22"
tar = "0.4"
flate2 = "1"
webpki-roots = "1"
# Remote updates: verify minisign release manifests (pure Rust, no dependencies).
minisign-verify = "0.3"
# Test-only: sign minisign fixtures (prehashed Ed25519 over BLAKE2b-512); both already locked transitively.
ring = "0.17"
blake2 = "0.11"
tokio-util = { version = "0.7", features = ["io"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dev/test builds keep line tables only (file:line in backtraces): full debuginfo made each integration-test binary
# ~280 MB and a tree copy's target dir 40–70 GB. Dependencies carry no debuginfo at all.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
