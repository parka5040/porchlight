# Laptop-only Tailscale sidecar stand-in: forward bytes, never terminate TLS.
global
    log stdout format raw local0
    maxconn 1024

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 1h
    timeout server 1h

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend funnel
    bind :9443
    default_backend porchlight

backend porchlight
    server api api:9443 send-proxy-v2 resolvers docker init-addr last,libc,none
