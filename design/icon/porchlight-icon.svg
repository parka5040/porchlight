<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Porchlight" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Porchlight</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#32302f"/>
      <stop offset="1" stop-color="#1d2021"/>
    </linearGradient>
    <radialGradient id="halo" cx="256" cy="272" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fabd2f" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#fe8019" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#fe8019" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glass" cx="256" cy="280" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fabd2f"/>
      <stop offset="0.6" stop-color="#d79921"/>
      <stop offset="1" stop-color="#b57614"/>
    </radialGradient>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- tile + warm halo -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <circle cx="256" cy="272" r="220" fill="url(#halo)"/>

    <!-- porch beam and hook -->
    <rect x="168" y="66" width="176" height="26" rx="9" fill="#665c54"/>
    <rect x="184" y="77" width="64" height="4" rx="2" fill="#504945"/>
    <rect x="270" y="77" width="58" height="4" rx="2" fill="#504945"/>
    <rect x="252" y="92" width="8" height="12" fill="#a89984"/>
    <circle cx="256" cy="116" r="13" fill="none" stroke="#a89984" stroke-width="8"/>

    <!-- cap -->
    <rect x="244" y="126" width="24" height="16" rx="4" fill="#7c6f64"/>
    <path d="M222 140 H290 L320 176 H192 Z" fill="#504945"/>
    <path d="M222 140 H256 V176 H192 Z" fill="#665c54" opacity="0.55"/>
    <rect x="180" y="172" width="152" height="20" rx="8" fill="#7c6f64"/>

    <!-- glowing glass -->
    <rect x="200" y="190" width="112" height="164" rx="14" fill="url(#glass)"/>
    <rect x="213" y="204" width="8" height="118" rx="4" fill="#fbf1c7" opacity="0.35"/>

    <!-- candle and flame -->
    <rect x="240" y="312" width="32" height="34" rx="5" fill="#ebdbb2"/>
    <rect x="240" y="312" width="10" height="34" rx="5" fill="#fbf1c7" opacity="0.6"/>
    <path d="M256 212 C275 240 290 258 290 282 C290 304 274 318 256 318 C238 318 222 304 222 282 C222 258 237 240 256 212 Z" fill="#fe8019"/>
    <path d="M256 236 C268 254 279 268 279 286 C279 302 269 312 256 312 C243 312 233 302 233 286 C233 268 244 254 256 236 Z" fill="#fabd2f"/>
    <path d="M256 262 C263 273 268 281 268 292 C268 302 263 308 256 308 C249 308 244 302 244 292 C244 281 249 273 256 262 Z" fill="#fbf1c7"/>

    <!-- frame posts -->
    <rect x="190" y="186" width="16" height="172" rx="6" fill="#504945"/>
    <rect x="306" y="186" width="16" height="172" rx="6" fill="#504945"/>

    <!-- base -->
    <rect x="180" y="350" width="152" height="20" rx="8" fill="#7c6f64"/>
    <path d="M200 370 H312 L298 394 H214 Z" fill="#504945"/>

    <!-- fireflies -->
    <circle cx="140" cy="248" r="5" fill="#fabd2f" opacity="0.8"/>
    <circle cx="378" cy="210" r="4" fill="#fabd2f" opacity="0.7"/>
    <circle cx="368" cy="330" r="3.5" fill="#b8bb26" opacity="0.7"/>
    <circle cx="160" cy="352" r="3" fill="#fabd2f" opacity="0.55"/>
  </g>
</svg>
