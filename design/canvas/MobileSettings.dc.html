<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Porchlight mobile settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#fabd2f}a:hover{color:#fbf1c7}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #282828; color: #ebdbb2; font-family: 'Source Sans 3', 'Segoe UI', sans-serif">
<header style="padding: 48px 8px 4px; display: flex; align-items: center; gap: 4px">
<a href="MobileToday.dc.html" aria-label="Back" style="width: 48px; height: 48px; display: grid; place-items: center; color: #ebdbb2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-family: 'Literata', Georgia, serif; font-size: 26px; font-weight: 600; color: #fbf1c7">Settings</h1>
</header>

<main style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 14px; padding: 4px 4px">
<span style="width: 48px; height: 48px; border-radius: 50%; background: #8ec07c; color: #1d2021; display: grid; place-items: center; font-size: 20px; font-weight: 700">A</span>
<div style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 18px; font-weight: 700; color: #fbf1c7">Alex</span><span style="font-size: 14px; color: #bdae93">User · this phone</span></div>
</div>

<section style="background: #32302f; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 16px">
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0; margin-bottom: 10px; font-size: 15px; font-weight: 700">Theme</legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<label style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; border-radius: 12px; border: 2px solid #fabd2f; background: #3c3836">
<span style="width: 100%; height: 44px; border-radius: 8px; background: #282828; display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box"><span style="width: 60%; height: 8px; border-radius: 4px; background: #fabd2f"></span></span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><input type="radio" name="theme" checked style="margin: 0; accent-color: #fabd2f">Evening</span>
</label>
<label style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; border-radius: 12px; border: 2px solid #504945; background: #3c3836">
<span style="width: 100%; height: 44px; border-radius: 8px; background: #fbf1c7; display: flex; align-items: flex-end; padding: 8px; box-sizing: border-box"><span style="width: 60%; height: 8px; border-radius: 4px; background: #b57614"></span></span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><input type="radio" name="theme" style="margin: 0; accent-color: #fabd2f">Daylight</span>
</label>
<label style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; border-radius: 12px; border: 2px solid #504945; background: #3c3836">
<span style="width: 100%; height: 44px; border-radius: 8px; overflow: hidden; display: flex"><span style="flex: 1; background: #fbf1c7"></span><span style="flex: 1; background: #282828"></span></span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><input type="radio" name="theme" style="margin: 0; accent-color: #fabd2f">System</span>
</label>
</div>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 700">Your color</span>
<div style="display: flex; justify-content: space-between">
<sc-for list="{{swatches}}" as="s" hint-placeholder-count="7">
<button aria-label="{{s.name}}" aria-pressed="{{s.pressed}}" style="width: 44px; height: 44px; border: 0; padding: 0; background: transparent; display: grid; place-items: center"><span style="width: 32px; height: 32px; border-radius: 50%; background: {{s.hex}}; box-shadow: {{s.ring}}"></span></button>
</sc-for>
</div>
</div>
</section>

<nav aria-label="Settings sections" style="background: #32302f; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column">
<a href="MobileSettingsToday.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 12px 0 16px; color: #ebdbb2; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#bdae93" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">Today</span><span style="font-size: 13px; color: #bdae93">4 sections · whole household</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bdae93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
<a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 12px 0 16px; border-top: 1px solid #3c3836; color: #ebdbb2; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#bdae93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h12M12 6l6 6-6 6"></path><path d="M20 4v16"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">Start screen</span><span style="font-size: 13px; color: #bdae93">Where I left off</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bdae93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
<a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 12px 0 16px; border-top: 1px solid #3c3836; color: #ebdbb2; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#bdae93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">Notifications</span><span style="font-size: 13px; color: #bdae93">Quiet 10 PM – 7 AM</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bdae93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
<a href="#" style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 0 12px 0 16px; border-top: 1px solid #3c3836; color: #ebdbb2; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#bdae93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"></rect><path d="M11 18h2"></path></svg>
<span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 600">Account and devices</span><span style="font-size: 13px; color: #bdae93">Password · 2 devices</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bdae93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</nav>

<div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: #bdae93"><span style="width: 8px; height: 8px; border-radius: 50%; background: #b8bb26"></span>Connected to home</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const swatches = [['Yellow', '#fabd2f'], ['Orange', '#fe8019'], ['Red', '#fb4934'], ['Pink', '#d3869b'], ['Aqua', '#8ec07c'], ['Blue', '#83a598'], ['Green', '#b8bb26']].map(([name, hex]) => ({
name, hex, pressed: name === 'Aqua' ? 'true' : 'false',
ring: name === 'Aqua' ? '0 0 0 3px #32302f, 0 0 0 5px #fbf1c7' : 'none'
}));
return { swatches };
}
}
</script>
</body>
</html>
