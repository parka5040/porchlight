<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Porchlight mobile Today settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#fabd2f}a:hover{color:#fbf1c7}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #282828; color: #ebdbb2; font-family: 'Source Sans 3', 'Segoe UI', sans-serif">
<header style="padding: 48px 8px 4px; display: flex; align-items: center; gap: 4px">
<a href="MobileSettings.dc.html" aria-label="Back to Settings" style="width: 48px; height: 48px; display: grid; place-items: center; color: #ebdbb2"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<h1 style="margin: 0; font-family: 'Literata', Georgia, serif; font-size: 26px; font-weight: 600; color: #fbf1c7">Today</h1>
</header>

<main style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 20px">
<span style="padding: 0 4px; font-size: 14px; line-height: 1.45; color: #bdae93">Drag to reorder. Turn off what you don't need. Syncs to all your devices.</span>

<section style="background: #32302f; border-radius: 16px; overflow: hidden">
<sc-for list="{{sections}}" as="t" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 8px; min-height: 66px; padding: 0 14px 0 2px; border-bottom: 1px solid #3c3836">
<button aria-label="Reorder {{t.name}}" style="width: 44px; height: 44px; flex: none; border: 0; background: transparent; color: #a89984; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"></circle><circle cx="15" cy="6" r="1.6"></circle><circle cx="9" cy="12" r="1.6"></circle><circle cx="15" cy="12" r="1.6"></circle><circle cx="9" cy="18" r="1.6"></circle><circle cx="15" cy="18" r="1.6"></circle></svg></button>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 600; color: {{t.color}}">{{t.name}}</span><span style="font-size: 13px; color: #bdae93">{{t.hint}}</span></div>
<button role="switch" aria-checked="{{t.checked}}" aria-label="Show {{t.name}}" style="width: 52px; height: 32px; flex: none; border-radius: 16px; border: 0; padding: 0; position: relative; background: {{t.track}}"><span style="position: absolute; top: 4px; left: {{t.knobLeft}}px; width: 24px; height: 24px; border-radius: 50%; background: {{t.knob}}"></span></button>
</div>
</sc-for>
</section>

<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="padding: 0 4px; margin-bottom: 10px; font-size: 15px; font-weight: 700">Show items for</legend>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #32302f; border-radius: 14px; padding: 4px">
<label style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 11px; font-size: 15px; font-weight: 600; color: #bdae93"><input type="radio" name="scope" style="margin: 0; accent-color: #fabd2f">Just me</label>
<label style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border-radius: 11px; background: #504945; font-size: 15px; font-weight: 600; color: #fbf1c7"><input type="radio" name="scope" checked style="margin: 0; accent-color: #fabd2f">Whole household</label>
</div>
</fieldset>

<label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; padding: 0 16px; border-radius: 16px; background: #32302f">
<span style="font-size: 16px; font-weight: 600">"This week" covers</span>
<select style="min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid #504945; background: #282828; color: #ebdbb2; font: 400 15px 'Source Sans 3', sans-serif"><option>Next 7 days</option><option>Rest of this week</option><option>Next 14 days</option></select>
</label>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const sw = (on) => ({ checked: on ? 'true' : 'false', track: on ? '#b8bb26' : '#665c54', knob: on ? '#1d2021' : '#d5c4a1', knobLeft: on ? 24 : 4 });
const sections = [
['Overdue', 'Missed items that carry over', true, '#fd8d7f'],
['Needs an owner', "Dependents' appointments nobody has taken", true, '#fe8019'],
['Today', 'Appointments and tasks due today', true, '#ebdbb2'],
['This week', 'What is coming up next', true, '#ebdbb2'],
['Pinned list: Groceries', 'One list at the bottom of Today', false, '#ebdbb2']
].map(([name, hint, on, color]) => Object.assign({ name, hint, color }, sw(on)));
return { sections };
}
}
</script>
</body>
</html>
